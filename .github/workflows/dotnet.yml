# This workflow will build a .NET project Unity Project.
# For more information see: https://game.ci/docs/github/getting-started
          
name: Unity Build and Release

on:
  push:
    branches:
      - main
      - testing
    tags:
      - 'v*' # Trigger workflow on version tags like v1.0.0

  pull_request:
    branches:
      - main
      - testing

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache Unity Library
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      # Run Unity Tests
      - name: Run Unity Tests
        id: testRunner
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Upload Test Results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: ${{ steps.testRunner.outputs.artifactsPath }}

      # Build Windows
      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Moving-Nightmare

      # Upload Build
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build/StandaloneWindows64

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    # Only release on pushes, never pull requests
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/testing' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    # Permissions
    permissions:
      contents: write

    steps:
      # Download Build
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: build/StandaloneWindows64

      # Zip Build
      - name: Zip Windows Build
        run: |
          cd build/StandaloneWindows64
          zip -r "$GITHUB_WORKSPACE/Moving-Nightmare.zip" .

# Create Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref == 'refs/heads/main' && format('release-{0}', github.run_number) || (github.ref == 'refs/heads/testing' && format('testing-{0}', github.run_number) || github.ref_name) }}"
          name: "${{ github.ref == 'refs/heads/main' && format('Production Release #{0}', github.run_number) || (github.ref == 'refs/heads/testing' && format('Testing Build #{0}', github.run_number) || github.ref_name) }}"
          target_commitish: "${{ github.sha }}"
          prerelease: "${{ github.ref == 'refs/heads/testing' }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Moving-Nightmare.zip
