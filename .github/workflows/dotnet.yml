# This workflow will build a .NET project Unity Project.
# For more information see: https://game.ci/docs/github/getting-started

name: Actions 😎

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:

jobs:
  build:
    name: Build my project ✨
    runs-on: ubuntu-latest
    
    # Permissions
    permissions:
      contents: write
      checks: write
      
    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Test
      - name: Run tests
        id: testRunner
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Upload Test Artifacts
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: ${{ steps.testRunner.outputs.artifactsPath }}

      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      # Output
      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build

      # Zip the build for release
      - name: Zip Windows Build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/StandaloneWindows64
          zip -r ../../Moving-Nightmare.zip *

      # Release & Upload Build Assets
      - name: Create GitHub Release and Upload Build
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Moving-Nightmare.zip
          generate_release_notes: true
